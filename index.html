<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLANTIS // SECURE TERMINAL v4.0</title>
    <style>
        :root {
            --glow: #ffffff;
            --bg: #000000;
            --bg-panel: #000000;
            --err: #ff1111;        
            --acc: #ffffff;
        }
        body {
            background-color: var(--bg);
            color: var(--glow);
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: 600;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        /* Сканлайны поверх всего экрана */
        body::before, body::after {
            content: " ";
            display: block;
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(255, 255, 255, 0.02) 50%, rgba(0, 0, 0, 0.5) 50%), linear-gradient(90deg, rgba(255, 255, 255, 0.02), rgba(0, 0, 0, 0), rgba(255, 255, 255, 0.02));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        body::after {
            background: linear-gradient(rgba(0, 0, 0, 0) 90%, rgba(255, 255, 255, 0.04) 95%, rgba(0, 0, 0, 0) 100%);
            background-size: 100% 300%;
            animation: scanline 8s linear infinite;
            z-index: 1000;
        }
        @keyframes scanline {
            0% { background-position: 0 -300%; }
            100% { background-position: 0 300%; }
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-4px, 2px); }
            40%, 80% { transform: translate(4px, -2px); }
        }
        .shake { animation: shake 0.2s ease-in-out 2; }

        /* Контейнер кинематографичного интро */
        #intro-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
            z-index: 50;
            background: #000000;
            transition: opacity 1s ease;
        }
        #intro-logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 40px;
            opacity: 0;
            filter: brightness(0) invert(1) drop-shadow(0 0 15px rgba(255,255,255,0.2));
            transition: opacity 1.5s ease;
            pointer-events: none;
        }
        #intro-text {
            max-width: 800px;
            font-size: 24px; /* Крупный текст по центру */
            line-height: 1.6;
            text-align: center;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Консоль (скрыта изначально) */
        .terminal-box {
            width: 100%;
            max-width: 850px;
            height: 85vh; 
            background: var(--bg-panel);
            border: 2px solid var(--glow); 
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            position: relative;
            box-sizing: border-box;
            display: none; /* Проявится через скрипт */
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .header {
            color: var(--glow);
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 15px;
            margin-bottom: 20px;
            font-weight: bold;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-shrink: 0;
        }
        .hub-logo {
            display: block;
            max-width: 150px;
            height: auto;
            margin: 0 auto 15px auto;
            opacity: 0.95;
            pointer-events: none;
            filter: brightness(0) invert(1); 
        }
        #out {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 8px;
            margin-bottom: 15px;
        }
        #out::-webkit-scrollbar { width: 4px; }
        #out::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        #out::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 2px; }

        .line {
            line-height: 1.6;
            margin-bottom: 8px;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .input-line {
            display: flex;
            align-items: center;
            margin-top: auto; 
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }
        .input-line.active { opacity: 1; visibility: visible; }
        .prompt {
            margin-right: 12px;
            color: var(--glow);
            font-weight: bold;
            flex-shrink: 0;
            letter-spacing: 1px;
        }
        .input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        input {
            position: absolute;
            inset: 0;
            opacity: 0;
            background: transparent;
            border: none;
            outline: none;
            cursor: text;
            width: 100%;
        }
        .custom-view {
            color: #ffffff;        
            font-family: inherit;
            font-size: inherit;
            white-space: pre-wrap;
            display: inline-flex;
            align-items: center;
        }
        .custom-view::after {
            content: '_';
            margin-left: 3px;
            color: var(--glow);
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .error { color: var(--err); font-weight: bold; }
        .success { color: var(--acc); font-weight: bold; }
        .gray { color: rgba(255, 255, 255, 0.5); }
    </style>
</head>
<body>

<!-- Экран кинематографичного интро -->
<div id="intro-screen">
    <img src="atlantis.png" id="intro-logo" alt="ATLANTIS LOGO">
    <div id="intro-text"></div>
</div>

<!-- Блок консоли -->
<div class="terminal-box" id="term">
    <div class="header" id="hd">
        <img src="atlantis.png" class="hub-logo" alt="ATLANTIS LOGO">
        P.M.C. "ATLANTIS" // INFILTRATION & STEALTH OPERATIONS NETWORK
    </div>
    <div id="out"></div>
    <div class="input-line" id="blk">
        <span class="prompt" id="pr">></span>
        <div class="input-wrapper">
            <input type="text" id="inp" autocomplete="off" disabled>
            <div class="custom-view" id="view"></div>
        </div>
    </div>
</div>
<script>
const CFG = { 
    SPD: 30 // Скорость печати букв для интро
};
const DOM = { 
    term: document.getElementById('term'), inp: document.getElementById('inp'), 
    view: document.getElementById('view'), out: document.getElementById('out'), 
    pr: document.getElementById('pr'), blk: document.getElementById('blk'),
    introScreen: document.getElementById('intro-screen'),
    introLogo: document.getElementById('intro-logo'),
    introText: document.getElementById('intro-text')
};

let isMask = false;
const delay = ms => new Promise(r => setTimeout(r, ms));
let audioCtx = null;

function playBeep(f, t, d) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
        osc.type = t; osc.frequency.value = f; 
        g.gain.setValueAtTime(0.015, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
        osc.connect(g); g.connect(audioCtx.destination); 
        osc.start(); osc.stop(audioCtx.currentTime + d);
    } catch(e) {}
}

function addLine(txt, cls = "") {
    const d = document.createElement('div'); d.className = `line ${cls}`; d.textContent = txt; 
    DOM.out.appendChild(d); DOM.out.scrollTop = DOM.out.scrollHeight; return d;
}

async function typeTerminal(txt, cls = "") {
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        d.textContent += txt.charAt(i); 
        if (Math.random() > 0.3) playBeep(840, 'square', 0.015); 
        await delay(CFG.SPD);
    }
}

// Отдельная функция печати для центрального интро
async function typeIntro(txt, startLogo = false) {
    if (startLogo) {
        DOM.introLogo.style.opacity = "0.85"; // Картинка плавно проявляется
    }
    for (let i = 0; i < txt.length; i++) {
        DOM.introText.textContent += txt.charAt(i);
        if (Math.random() > 0.3) playBeep(700, 'sine', 0.02);
        await delay(CFG.SPD + 10);
    }
}

function ask(promptText, maskInput = false) { 
    isMask = maskInput; 
    DOM.pr.textContent = promptText; 
    DOM.inp.value = DOM.view.textContent = ""; 
    DOM.inp.disabled = false; 
    DOM.blk.classList.add('active'); 
    DOM.inp.focus(); 
}

async function runCinematicIntro() {
    DOM.introText.textContent = "";
    
    // Первая фраза
    await typeIntro("Сергей — хороший человек и отличный ГСБ, которого искренне уважает его отдел. ");
    await delay(1200);
    
    // Вторая фраза
    await typeIntro("Но задумывались ли вы когда-нибудь, через какой ад ему пришлось пройти и что именно он пережил, чтобы в итоге занять это кресло?\n\n");
    await delay(1500);
    
    // Третья фраза: Начинает писаться "За жестким характером..." — выкатывается картинка
    await typeIntro("За жестким характером, вечной трубкой в зубах и тяжелым взглядом скрывается история парня, которого жизнь ломала с самого детства.", true);
    await delay(3500);

    // Плавное исчезновение интро-экрана
    DOM.introScreen.style.opacity = "0";
    await delay(1000);
    DOM.introScreen.style.display = "none";

    // Плавное появление основной консоли
    DOM.term.style.display = "flex";
    await delay(50);
    DOM.term.style.opacity = "1";
    
    // Запуск интерфейса хаба
    await delay(400);
    await typeTerminal("PMC ATLANTIS // CENTRAL CORE TERMINAL v4.0", "success");
    await typeTerminal("SYSTEM INITIALIZED. STANDING BY FOR COMMANDS...", "gray");
    
    ask('ENTER COMMAND:', false);
}

DOM.inp.oninput = () => { 
    DOM.view.textContent = isMask ? "*".repeat(DOM.inp.value.length) : DOM.inp.value; 
};

DOM.inp.onkeydown = async (e) => {
    if (e.key !== 'Enter') return;
    
    const v = DOM.inp.value, cv = v.trim(); 
    if (!v) return;

    DOM.blk.classList.remove('active'); 
    DOM.inp.disabled = true; 
    
    addLine(DOM.pr.textContent + " " + (isMask ? "*".repeat(v.length) : cv), 'success'); 
    await delay(300);
    
    await typeTerminal(`Получена команда: ${cv}`, "gray");
    ask('ENTER COMMAND:', false);
};

document.onclick = () => DOM.inp.disabled || DOM.inp.focus(); 
window.onload = runCinematicIntro;
</script>
</body>
</html>
