<script>
const CFG = { 
    SPD_INTRO: 30,
    SPD_TERMINAL: 15,
    SPD_BIO: 5,
    SPD_DIALOGUE: 25,
    SPD_DEAD: 50,
    SPD_MONOLOGUE: 35 
};

const DOM = { 
    term: document.getElementById('term'), inp: document.getElementById('inp'), 
    view: document.getElementById('view'), out: document.getElementById('out'), 
    pr: document.getElementById('pr'), blk: document.getElementById('blk'),
    introScreen: document.getElementById('intro-screen'),
    introLogo: document.getElementById('intro-logo'),
    introText: document.getElementById('intro-text'),
    hd: document.getElementById('hd'),
    logosBox: document.getElementById('logos-box'),
    titleText: document.getElementById('title-text'),
    bloodBg: document.getElementById('blood-bg')
};

let step = 'menu'; 
let currentChapterIdx = 0;
let isMask = false;
let isPrinting = false;
const delay = ms => new Promise(r => setTimeout(r, ms));
let audioCtx = null;

function playBeep(f, t, d) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
        osc.type = t; osc.frequency.value = f; 
        g.gain.setValueAtTime(0.015, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
        osc.connect(g); g.connect(audioCtx.destination); 
        osc.start(); osc.stop(audioCtx.currentTime + d);
    } catch(e) {}
}

function playSiren(duration) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(55, audioCtx.currentTime + duration);
        g.gain.setValueAtTime(0.02, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
}

function addLine(txt, cls = "") {
    const d = document.createElement('div'); d.className = `line ${cls}`; d.textContent = txt; 
    DOM.out.appendChild(d); 
    // ИСПРАВЛЕНО: Гарантированная жесткая прокрутка к низу контейнера при добавлении новой строки
    DOM.out.scrollTop = DOM.out.scrollHeight; 
    return d;
}

async function typeTerminal(txt, cls = "", speed = CFG.SPD_TERMINAL, withBeep = true) {
    isPrinting = true;
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        d.textContent += txt.charAt(i); 
        if (withBeep && Math.random() > 0.3) playBeep(840, 'square', 0.015); 
        // ИСПРАВЛЕНО: Безусловный авто-скролл на каждом напечатанном символе
        DOM.out.scrollTop = DOM.out.scrollHeight; 
        await delay(speed);
    }
    isPrinting = false;
}

async function typeAnimateDialogue(txt, cls = "") {
    isPrinting = true;
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        const span = document.createElement('span');
        span.className = 'char-anim';
        span.textContent = txt.charAt(i);
        d.appendChild(span);
        if (Math.random() > 0.3) playBeep(720, 'triangle', 0.02); 
        // ИСПРАВЛЕНО: Авто-скролл при появлении анимированных волновых букв фракций
        DOM.out.scrollTop = DOM.out.scrollHeight; 
        await delay(CFG.SPD_DIALOGUE);
    }
    isPrinting = false;
}

`,

    `ГЛАВА 2: Мам...?

По прибытии на станцию ЦК Сергея привели в кабинет Инспектора. В комнате повисла тяжелая, грубая тишина. ГСБ прекрасно понимал, что от него ждут раскаяния, и решил не тянуть время:
«Я понял, почему вы все молчите. Ожидаете от меня услышать извинения. Я, может, и согласен, что где-то был не прав. Но я вам нужен. Я хороший руководитель. Нашел ваш чертов ящик всего за час на гигантской станции, хотя он мог быть где угодно.». 
Инспектор и Синие Щиты продолжали молчать. Долороффа вывели из кабинета и повели по коридорам. Но вместо карцера или трибунала его привели в бар. Там, посреди тишины, Инспектор молча выдал медаль «Лучший ГСБ». ЦК не любило дерзость, но они чертовски сильно ценили результат и лидеров.`
];

async function typeIntro(txt, startLogo = false) {
    if (startLogo) DOM.introLogo.style.opacity = "1";
    for (let i = 0; i < txt.length; i++) {
        DOM.introText.textContent += txt.charAt(i);
        if (Math.random() > 0.3) playBeep(700, 'sine', 0.02);
        await delay(CFG.SPD_INTRO);
    }
}

function ask(promptText, maskInput = false) { 
    isMask = maskInput; 
    DOM.pr.textContent = promptText; 
    DOM.inp.value = DOM.view.textContent = ""; 
    DOM.inp.disabled = false; 
    DOM.blk.classList.add('active'); 
    DOM.inp.focus(); 
}

DOM.inp.oninput = () => { 
    if(step === 'menu' || step === 'branch_selection') {
        DOM.view.textContent = isMask ? "*".repeat(DOM.inp.value.length) : DOM.inp.value; 
    } else {
        DOM.view.textContent = "";
    }
};

DOM.inp.onkeydown = async (e) => {
    if (e.key !== 'Enter' || isPrinting) return;
    const v = DOM.inp.value, cv = v.trim().toUpperCase();

    if (step === 'menu') {
        if (!v) return;
        DOM.blk.classList.remove('active'); DOM.inp.disabled = true; 
        addLine(DOM.pr.textContent + " " + v, 'success'); await delay(300);

        if (v.trim() === '676') {
            await runTerminalFadeOut();
        } else if (v.trim() === '1') {
            currentChapterIdx = 0; DOM.out.innerHTML = ""; await printNextChapter();
        } else {
            DOM.term.classList.add('shake'); playBeep(130, 'triangle', 0.35);
            setTimeout(() => DOM.term.classList.remove('shake'), 400);
            addLine("ОШИБКА: НЕВЕРНЫЙ ВЫБОР", "error"); await delay(1000); await showMainMenu();
        }
    } 
    else if (step === 'reading_bio') {
        DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
        await printNextChapter();
    }
    else if (step === 'bio_finished') {
        DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
        await runDialogueStage1(); 
    }
    else if (step === 'dialogue_1') {
        DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
        await runDialogueStage2();
    }
    else if (step === 'dialogue_2') {
        DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
        await runDialogueStage3();
    }
    else if (step === 'dialogue_3') {
        DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
        await runTerminalFadeOut();
    }
    else if (step === 'sergey_confession_init') {
        DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
        await runSergeyConfessionDialogue();
    }
    else if (step === 'branch_selection') {
        if (!v) return;
        DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
        addLine(DOM.pr.textContent + " " + v, 'success'); await delay(300);

        if (cv === 'А' || cv === 'A' || cv === 'Ф') {
            await runBranchA();
        } else if (cv === 'Б' || cv === 'B' || cv === 'И') {
            await runBranchB();
        } else if (cv === 'В' || cv === 'V' || cv === 'W' || cv === 'М') {
            await runBranchV();
        } else {
            DOM.term.classList.add('shake'); playBeep(130, 'triangle', 0.35);
            setTimeout(() => DOM.term.classList.remove('shake'), 400);
            addLine("НЕВЕРНЫЙ ИНДЕКС ЛОГА. ПОВТОРИТЕ ВВОД.", "error"); await delay(1000);
            await showBranchOptions();
        }
    }
};

document.onclick = () => DOM.inp.disabled || DOM.inp.focus(); 
window.onload = runCinematicIntro;
</script>
