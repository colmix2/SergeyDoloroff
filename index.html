<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLANTIS // SECURE TERMINAL v4.0</title>
    <style>
        :root {
            --glow: #ffffff;
            --bg: #000000;
            --bg-panel: #000000;
            --err: #ff1111;        
            --acc: #ffffff;
            
            --color-bordo: #800020;    
            --color-yellow: #ffcc00;   
            --color-red: #ff1111;      
        }
        body {
            background-color: var(--bg);
            color: var(--glow);
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: 600;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background 1.5s ease;
        }

        /* Центрированный кинематографичный интро-экран */
        #intro-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
            z-index: 50;
            background: #000000;
            transition: opacity 1s ease;
        }
        
        /* Логотип жестко зажат в размерах */
        #intro-logo {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin: 0 auto 30px auto;
            opacity: 0;
            filter: brightness(0) invert(1);
            transition: opacity 1.5s ease;
            pointer-events: none;
            display: block;
        }
        
        /* Крупный читаемый текст по центру */
        #intro-text {
            width: 100%;
            max-width: 800px;
            font-size: 24px;
            line-height: 1.6;
            text-align: center;
            white-space: pre-wrap;
            word-break: break-word;
            color: #ffffff;
            margin: 0 auto;
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-4px, 2px); }
            40%, 80% { transform: translate(4px, -2px); }
        }
        .shake { animation: shake 0.2s ease-in-out 2; }
        .terminal-box {
            width: 100%;
            max-width: 850px;
            height: 85vh; 
            background: var(--bg-panel);
            border: 2px solid var(--glow); 
            border-radius: 8px;
            padding: 30px;
            position: relative;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transition: opacity 3s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }

        /* Полупрозрачный фоновый слой крови за текстом */
        .blood-overlay {
            position: absolute;
            inset: 0;
            background-image: url('blood.png');
            background-size: cover;
            background-position: center;
            opacity: 0; 
            z-index: 1;  
            pointer-events: none;
            transition: opacity 3s ease;
        }

        .terminal-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* Неоновые рамки этапов откровения */
        .terminal-box.stage-bordo {
            border-color: var(--color-bordo) !important;
            box-shadow: 0 0 20px var(--color-bordo), inset 0 0 10px var(--color-bordo) !important;
            border-image: none !important;
        }
        .terminal-box.stage-split-2 {
            border-style: solid;
            border-width: 2px;
            border-image: linear-gradient(to right, var(--color-bordo) 50%, var(--color-yellow) 50%) 1 !important;
            box-shadow: -10px 0 20px var(--color-bordo), 10px 0 20px var(--color-yellow) !important;
        }
        .terminal-box.stage-split-3 {
            border-style: solid;
            border-width: 2px;
            border-image: linear-gradient(to right, var(--color-bordo) 33%, var(--color-yellow) 33%, var(--color-yellow) 66%, var(--color-red) 66%) 1 !important;
            box-shadow: -15px 0 25px var(--color-bordo), 0 0 25px var(--color-yellow), 15px 0 25px var(--color-red) !important;
        }

        /* Медленное, плавное угасание и потеря контраста (безопасно для эпилептиков) */
        @keyframes staticDepression {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.20; }
        }
        
        .terminal-box.dead-console {
            border-color: #333333 !important;
            border-image: none !important;
            box-shadow: none !important;
            animation: staticDepression 4s ease-in-out infinite; 
        }
        .header {
            color: var(--glow);
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 15px;
            margin-bottom: 20px;
            font-weight: bold;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-shrink: 0;
            transition: border-bottom-color 0.5s ease, color 0.5s ease, font-size 0.5s ease;
        }
        
        .header.shock-text {
            color: #888888; 
            font-size: 22px !important;
            letter-spacing: 2px !important;
            border-bottom-color: #222222 !important;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-bottom: 15px;
            min-height: 85px; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 0.95; transform: scale(1); }
        }
        
        .hub-logo {
            display: block;
            height: 80px;  
            width: 80px;   
            object-fit: cover;
            pointer-events: none;
            border-radius: 50%; 
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .logo-atlantis { filter: brightness(0) invert(1); }
        .logo-las { filter: invert(9%) sepia(87%) saturate(5484%) hue-rotate(334deg) brightness(60%) contrast(100%) drop-shadow(0 0 12px var(--color-bordo)); }
        .logo-art { filter: invert(74%) sepia(93%) saturate(1478%) hue-rotate(360deg) brightness(103%) contrast(106%) drop-shadow(0 0 12px var(--color-yellow)); }
        .logo-tfb { filter: invert(14%) sepia(96%) saturate(5799%) hue-rotate(357deg) brightness(98%) contrast(113%) drop-shadow(0 0 12px var(--color-red)); }
        
        #out {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 8px;
            margin-bottom: 15px;
            scroll-behavior: smooth;
        }
        #out::-webkit-scrollbar { width: 4px; }
        #out::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        #out::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 2px; }

        .line {
            line-height: 1.6;
            margin-bottom: 8px;
            word-break: break-all;
            white-space: pre-wrap;
            padding-left: 12px; /* ИСПРАВЛЕНО: Рамка больше не будет урезать первую букву */
        }

        .txt-bordo { color: #ff2266 !important; font-weight: bold; text-shadow: 0 0 4px rgba(255, 34, 102, 0.3); }
        .txt-yellow { color: var(--color-yellow) !important; font-weight: bold; text-shadow: 0 0 4px rgba(255, 204, 0, 0.3); }
        .txt-red { color: var(--color-red) !important; font-weight: bold; text-shadow: 0 0 5px rgba(255, 17, 17, 0.4); }
        
        .txt-dead { color: #888888 !important; font-weight: normal; }
        .txt-sergey { color: #ffffff !important; font-weight: bold; text-shadow: 0 0 8px rgba(255, 255, 255, 0.6); }
        .txt-anon { color: #bbbbbb !important; font-style: italic; text-shadow: 0 0 6px rgba(255, 255, 255, 0.3); }

        .input-line {
            display: flex;
            align-items: center;
            margin-top: auto; 
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, border-top-color 0.5s ease;
            flex-shrink: 0;
        }
        .input-line.active { opacity: 1; visibility: visible; }
        
        .prompt {
            margin-right: 12px;
            margin-left: 12px; /* ИСПРАВЛЕНО: Выравнивает указатель ввода ровно по тексту логов */
            color: var(--glow);
            font-weight: bold;
            flex-shrink: 0;
            letter-spacing: 1px;
        }
        .input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        input {
            position: absolute;
            inset: 0;
            opacity: 0;
            background: transparent;
            border: none;
            outline: none;
            cursor: text;
            width: 100%;
        }
        .custom-view {
            color: #ffffff;        
            font-family: inherit;
            font-size: inherit;
            white-space: pre-wrap;
            display: inline-flex;
            align-items: center;
        }
        .custom-view::after {
            content: '_';
            margin-left: 3px;
            color: var(--glow);
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .error { color: var(--err); font-weight: bold; text-shadow: 0 0 8px rgba(255, 17, 17, 0.5); }
        .success { color: var(--acc); font-weight: bold; }
        .gray { color: #ffffff; opacity: 0.5; }
    </style>
</head>
<body>

<div id="intro-screen">
    <img src="atlantis.png" id="intro-logo" alt="ATLANTIS LOGO">
    <div id="intro-text"></div>
</div>

<div class="terminal-box" id="term">
    <div class="blood-overlay" id="blood-bg"></div>
    
    <div class="terminal-content">
        <div class="header" id="hd">
            <div class="logo-container" id="logos-box">
                <img src="atlantis.png" class="hub-logo logo-atlantis" alt="LOGOTYPE">
            </div>
            <span id="title-text">P.M.C. "ATLANTIS" // INFILTRATION & STEALTH OPERATIONS NETWORK</span>
        </div>

        <div class="input-line" id="blk">
            <span class="prompt" id="pr">></span>
            <div class="input-wrapper">
                <input type="text" id="inp" autocomplete="off" disabled>
                <div class="custom-view" id="view"></div>
            </div>
        </div>
    </div>
</div>
<script>
const CFG = { 
    SPD_INTRO: 30,
    SPD_TERMINAL: 15,
    SPD_BIO: 5,
    SPD_DIALOGUE: 25,
    SPD_DEAD: 50,
    SPD_MONOLOGUE: 35 
};

const DOM = { 
    term: document.getElementById('term'), inp: document.getElementById('inp'), 
    view: document.getElementById('view'), out: document.getElementById('out'), 
    pr: document.getElementById('pr'), blk: document.getElementById('blk'),
    introScreen: document.getElementById('intro-screen'),
    introLogo: document.getElementById('intro-logo'),
    introText: document.getElementById('intro-text'),
    hd: document.getElementById('hd'),
    logosBox: document.getElementById('logos-box'),
    titleText: document.getElementById('title-text'),
    bloodBg: document.getElementById('blood-bg')
};

let step = 'menu'; 
let currentChapterIdx = 0;
let isMask = false;
let isPrinting = false;
const delay = ms => new Promise(r => setTimeout(r, ms));
let audioCtx = null;
let sergeyMusic = null; // Движок для атмосферного трека 13AM.mp3

// Функция включения вашей музыки для сломанной консоли
function playSergeyMusic() {
    if (!sergeyMusic) {
        sergeyMusic = new Audio('13AM.mp3');
        sergeyMusic.loop = true;          // Музыка играет бесконечно по кругу (циклично)
        sergeyMusic.volume = 0.5;         // Умеренная громкость фонового эмбиента
    }
    // Возобновляем или запускаем заново
    sergeyMusic.currentTime = 0;
    sergeyMusic.play().catch(e => console.log("Браузер заблокировал авто-воспроизведение музыки"));
}

// Функция отключения музыки при возможном выходе/сбросе меню
function stopSergeyMusic() {
    if (sergeyMusic) {
        sergeyMusic.pause();
        sergeyMusic.currentTime = 0;
    }
}

function playBeep(f, t, d) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
        osc.type = t; osc.frequency.value = f; 
        g.gain.setValueAtTime(0.015, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
        osc.connect(g); g.connect(audioCtx.destination); 
        osc.start(); osc.stop(audioCtx.currentTime + d);
    } catch(e) {}
}

function playSiren(duration) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(55, audioCtx.currentTime + duration);
        g.gain.setValueAtTime(0.02, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
}

function addLine(txt, cls = "") {
    const d = document.createElement('div'); d.className = `line ${cls}`; d.textContent = txt; 
    DOM.out.appendChild(d); 
    DOM.out.scrollTop = DOM.out.scrollHeight; 
    return d;
}

async function typeTerminal(txt, cls = "", speed = CFG.SPD_TERMINAL, withBeep = true) {
    isPrinting = true;
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        d.textContent += txt.charAt(i); 
        if (withBeep && Math.random() > 0.3) playBeep(840, 'square', 0.015); 
        DOM.out.scrollTop = DOM.out.scrollHeight; 
        await delay(speed);
    }
    isPrinting = false;
}

async function typeAnimateDialogue(txt, cls = "") {
    isPrinting = true;
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        const span = document.createElement('span');
        span.className = 'char-anim';
        span.textContent = txt.charAt(i);
        d.appendChild(span);
        if (Math.random() > 0.3) playBeep(720, 'triangle', 0.02); 
        DOM.out.scrollTop = DOM.out.scrollHeight; 
        await delay(CFG.SPD_DIALOGUE);
    }
    isPrinting = false;
}
async function runSergeyConfessionDialogue() {
    step = 'branch_selection'; 
    
    await typeTerminal("[УДЕЛЕННЫЙ ПЕРЕХВАТ КАНАЛА ШИФРОВАНИЯ...]", "txt-anon", CFG.SPD_MONOLOGUE, false);
    await typeTerminal("???: Я не успею все зашифровать..", "txt-anon", CFG.SPD_MONOLOGUE, false);
    await typeTerminal("???: Я правда не хотел чтобы это произошло..", "txt-anon", CFG.SPD_MONOLOGUE, false);
    await typeTerminal("???: Я просто выполнял свою работу, я не хотел убивать Гилберта, я не хотел взрывать АЭС или расстреливать Расонийцев. Я просто боролся за свою жизнь..", "txt-anon", CFG.SPD_MONOLOGUE, false);
    await delay(1000);
    
    await typeTerminal("\nСергей: Я, Сергей, признаю что это все моих рук дело. Потеряв мать я опустил руки. У меня не было смысла жизни. ", "txt-sergey", CFG.SPD_MONOLOGUE, false);
    await typeTerminal("Сергей: Я хотел пойти по стопам матери.. Сдать юридический, стать лучшим адвокатом, доказывать невиновность людей. А щас что? А какой смысл идти куда-то дальше? Я все потерял что имел. Я стал пить, курить, не имею образования, семья разрушена..", "txt-sergey", CFG.SPD_MONOLOGUE, false);
    
    await showBranchOptions();
}

async function showBranchOptions() {
    step = 'branch_selection';
    addLine("\n---------------------------------------------------", "gray");
    await typeTerminal("ВЫБЕРИТЕ НАПРАВЛЕНИЕ АНАЛИЗА АУДИОЛОГОВ:", "success", CFG.SPD_TERMINAL, false);
    await typeTerminal("А) Что случилось с твоей семьей?", "txt-sergey", CFG.SPD_TERMINAL, false);
    await typeTerminal("Б) Почему ты не смог стать юристом?", "txt-sergey", CFG.SPD_TERMINAL, false);
    await typeTerminal("В) Можешь ли ты мне дать все отчёты Итагурской?", "txt-sergey", CFG.SPD_TERMINAL, false);
    ask('ВВЕДИТЕ ВАРИАНТ (А, Б или В):', false);
}

async function runBranchA() {
    step = 'branch_processing';
    addLine("");
    await typeTerminal("Сергей: Мне было 16. Я закончил 9 класс и решил погулять со своими друзьями до поздна. Я много раз конфликтовал с мамой когда она была пьяна, орал, говорил что она сама ничего не добилась и не стану как она. Но когда она трезвая, мы как семья. Она мне написала чтобы я вернулся домой и начала доставать, я сказал чтобы она шла нахуй пока не отрезвеет..", "txt-sergey", CFG.SPD_MONOLOGUE, false);
    await typeTerminal("Сергей: Когда я пришел домой я заметил ее лежащей среди бутылок. Я перевернул ее лицом к себе и заметил, что она не смотрит на меня и не отвечает..", "txt-sergey", CFG.SPD_MONOLOGUE, false);
    await typeTerminal("Сергей: Приложив два пальца к шее, я понял что у нее нет пульса..", "txt-sergey", CFG.SPD_MONOLOGUE, false);
    await typeTerminal("Сергей: Я.. Я правда.. Я правда жалею что я такой ублюдок, я не знал цены и не знал кто такая Мать. Я виноват, я тварь, я просто ненавижу блядь, презираю свое существование..", "txt-sergey", CFG.SPD_MONOLOGUE, false);
    await typeTerminal("Сергей: Я позвонил в скорую и мне сказали что ее не удалось спасти..", "txt-sergey", CFG.SPD_MONOLOGUE, false);
    await typeTerminal("Сергей: Папа много работал, у него не было времени проводить со мной время. Он всегда был занят своей работой, он пахал чтобы просто обеспечить меня моими хотелками, хотя он не понимал, что мне просто нужно его внимание..", "txt-sergey", CFG.SPD_MONOLOGUE, false);
    await showBranchOptions();
}

async function runBranchB() {
    step = 'branch_processing';
    addLine("");
    await typeTerminal("Сергей: После смерти моей мамы, я начал сильно пить. У меня развилась алкогольная амнезия и зависимость..", "txt-sergey", CFG.SPD_MONOLOGUE, false);
    await typeTerminal("Сергей: Пытаясь глушить свою боль и зависимость я стал курить. Я решил быть как дедушка, взял трубку да попробовал курить с нее. И мне понравилось..", "txt-sergey", CFG.SPD_MONOLOGUE, false);
    await typeTerminal("Сергей: Я может и не самый лучший ребенок, скорее, я вообще не имел право получить высшее образование, судьба наделила меня этим, чтобы я воевал чтобы заглушить свою боль и получить хоть какие то деньги..", "txt-sergey", CFG.SPD_MONOLOGUE, false);
    await typeTerminal("Сергей: Я не смог поступить, эти зависимости меня гасили. Постоянные опаздывания, хамство с преподами, кураторами..", "txt-sergey", CFG.SPD_MONOLOGUE, false);
    await typeTerminal("Сергей: Лучше бы я сдох на Итагурской..", "txt-sergey", CFG.SPD_MONOLOGUE, false);
    await showBranchOptions();
}

async function runBranchV() {
    step = 'branch_processing';
    addLine("");
    await typeTerminal("Сергей: Это не так просто. После собеседования комитета между тремя департаментами, отчеты разделились на 3 группы..", "txt-sergey", CFG.SPD_MONOLOGUE, false);
    await typeTerminal("Сергей: Департамент L.a.S имел все отчёты что происходило на Итагурской. Департамент A.R.T имел все отчёты умерших бойцов, экспериментов и отчёты изучений вируса WE-30. Департамент T.F.B имел все отчёты что связано с линиями фронта, бойцов..", "txt-sergey", CFG.SPD_MONOLOGUE, false);
    await typeTerminal("Сергей: Я обладаю паролями департаментов, но не их консоли. L.a.S 577, T.F.B 687, A.R.T 432", "txt-sergey", CFG.SPD_MONOLOGUE, false);
    await showBranchOptions();
}

DOM.inp.oninput = () => { 
    if(step === 'menu' || step === 'branch_selection') {
        DOM.view.textContent = isMask ? "*".repeat(DOM.inp.value.length) : DOM.inp.value; 
    } else {
        DOM.view.textContent = "";
    }
};

DOM.inp.onkeydown = async (e) => {
    if (e.key !== 'Enter' || isPrinting) return;
    const v = DOM.inp.value, cv = v.trim().toUpperCase();

    if (step === 'menu') {
        if (!v) return;
        DOM.blk.classList.remove('active'); DOM.inp.disabled = true; 
        addLine(DOM.pr.textContent + " " + v, 'success'); await delay(300);

        if (v.trim() === '676') {
            stopSergeyMusic(); // Сброс трека на случай повторов
            await runTerminalFadeOut();
        } else if (v.trim() === '1') {
            stopSergeyMusic();
            currentChapterIdx = 0; DOM.out.innerHTML = ""; await printNextChapter();
        } else {
            DOM.term.classList.add('shake'); playBeep(130, 'triangle', 0.35);
            setTimeout(() => DOM.term.classList.remove('shake'), 400);
            addLine("ОШИБКА: НЕВЕРНЫЙ ВЫБОР", "error"); await delay(1000); await showMainMenu();
        }
    } 
    else if (step === 'reading_bio') {
        DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
        await printNextChapter();
    }
    else if (step === 'bio_finished') {
        DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
        await runDialogueStage1(); 
    }
    else if (step === 'dialogue_1') {
        DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
        await runDialogueStage2();
    }
    else if (step === 'dialogue_2') {
        DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
        await runDialogueStage3();
    }
    else if (step === 'dialogue_3') {
        DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
        await runTerminalFadeOut();
    }
    else if (step === 'sergey_confession_init') {
        DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
        // ВКЛЮЧЕНИЕ ЦИКЛИЧНОЙ МУЗЫКИ 13AM.mp3
        playSergeyMusic(); 
        await runSergeyConfessionDialogue();
    }
    else if (step === 'branch_selection') {
        if (!v) return;
        DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
        addLine(DOM.pr.textContent + " " + v, 'success'); await delay(300);

        if (cv === 'А' || cv === 'A' || cv === 'Ф') {
            await runBranchA();
        } else if (cv === 'Б' || cv === 'B' || cv === 'И') {
            await runBranchB();
        } else if (cv === 'В' || cv === 'V' || cv === 'W' || cv === 'М') {
            await runBranchV();
        } else {
            DOM.term.classList.add('shake'); playBeep(130, 'triangle', 0.35);
            setTimeout(() => DOM.term.classList.remove('shake'), 400);
            addLine("НЕВЕРНЫЙ ИНДЕКС ЛОГА. ПОВТОРИТЕ ВВОД.", "error"); await delay(1000);
            await showBranchOptions();
        }
    }
};

document.onclick = () => DOM.inp.disabled || DOM.inp.focus(); 
window.onload = runCinematicIntro;
</script>
</body>
</html>
