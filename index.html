<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLANTIS // SECURE TERMINAL v4.0</title>
    <style>
        :root {
            --glow: #ffffff;
            --bg: #000000;
            --bg-panel: #000000;
            --err: #ff1111;        
            --acc: #ffffff;
            
            --color-bordo: #800020;    
            --color-yellow: #ffcc00;   
            --color-red: #ff1111;      
        }
        body {
            background-color: var(--bg);
            color: var(--glow);
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: 600;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background 1.5s ease;
        }

        /* ИСПРАВЛЕНО: Центрированный кинематографичный интро-экран */
        #intro-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
            z-index: 50;
            background: #000000;
            transition: opacity 1s ease;
        }
        
        /* ИСПРАВЛЕНО: Логотип жестко зажат в размерах и не ломает верстку */
        #intro-logo {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin: 0 auto 30px auto;
            opacity: 0;
            filter: brightness(0) invert(1);
            transition: opacity 1.5s ease;
            pointer-events: none;
            display: block;
        }
        
        /* ИСПРАВЛЕНО: Крупный читаемый текст по центру */
        #intro-text {
            width: 100%;
            max-width: 800px;
            font-size: 24px;
            line-height: 1.6;
            text-align: center;
            white-space: pre-wrap;
            word-break: break-word;
            color: #ffffff;
            margin: 0 auto;
        }

        body.shock-vignette {
            background: radial-gradient(circle, #000000 30%, #050002 70%, #000000 100%);
        }
        body.shock-vignette::before {
            content: "";
            position: fixed;
            inset: 0;
            box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.95), inset 0 0 100px rgba(94, 11, 33, 0.3);
            z-index: 999;
            pointer-events: none;
            animation: pulseVignette 2s infinite alternate;
        }

        @keyframes pulseVignette {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-4px, 2px); }
            40%, 80% { transform: translate(4px, -2px); }
        }
        .shake { animation: shake 0.2s ease-in-out 2; }
        .terminal-box {
            width: 100%;
            max-width: 850px;
            height: 85vh; 
            background: var(--bg-panel);
            border: 2px solid var(--glow); 
            border-radius: 8px;
            padding: 30px;
            position: relative;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transition: opacity 3s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }

        .terminal-box.stage-bordo {
            border-color: var(--color-bordo) !important;
            box-shadow: 0 0 20px var(--color-bordo), inset 0 0 10px var(--color-bordo) !important;
            border-image: none !important;
        }
        .terminal-box.stage-split-2 {
            border-style: solid;
            border-width: 2px;
            border-image: linear-gradient(to right, var(--color-bordo) 50%, var(--color-yellow) 50%) 1 !important;
            box-shadow: -10px 0 20px var(--color-bordo), 10px 0 20px var(--color-yellow) !important;
        }
        .terminal-box.stage-split-3 {
            border-style: solid;
            border-width: 2px;
            border-image: linear-gradient(to right, var(--color-bordo) 33%, var(--color-yellow) 33%, var(--color-yellow) 66%, var(--color-red) 66%) 1 !important;
            box-shadow: -15px 0 25px var(--color-bordo), 0 0 25px var(--color-yellow), 15px 0 25px var(--color-red) !important;
        }

        .terminal-box.dead-console {
            border-color: #444444 !important;
            border-image: none !important;
            box-shadow: none !important;
            opacity: 0.35 !important;
            filter: grayscale(100%);
        }

        .header {
            color: var(--glow);
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 15px;
            margin-bottom: 20px;
            font-weight: bold;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-shrink: 0;
            transition: border-bottom-color 0.5s ease, color 0.5s ease, font-size 0.5s ease;
        }
        
        .header.shock-text {
            color: #888888 !important;
            font-size: 22px !important;
            letter-spacing: 2px !important;
            border-bottom-color: #333333 !important;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-bottom: 15px;
            min-height: 85px; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9) rotate(-5deg); }
            to { opacity: 0.95; transform: scale(1) rotate(0deg); }
        }
        
        .hub-logo {
            display: block;
            height: 80px;  
            width: 80px;   
            object-fit: cover;
            pointer-events: none;
            border-radius: 50%; 
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .logo-atlantis { filter: brightness(0) invert(1); }
        .logo-las { filter: invert(9%) sepia(87%) saturate(5484%) hue-rotate(334deg) brightness(60%) contrast(100%) drop-shadow(0 0 12px var(--color-bordo)); }
        .logo-art { filter: invert(74%) sepia(93%) saturate(1478%) hue-rotate(360deg) brightness(103%) contrast(106%) drop-shadow(0 0 12px var(--color-yellow)); }
        .logo-tfb { filter: invert(14%) sepia(96%) saturate(5799%) hue-rotate(357deg) brightness(98%) contrast(113%) drop-shadow(0 0 12px var(--color-red)); }
        
        #out {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 8px;
            margin-bottom: 15px;
        }
        #out::-webkit-scrollbar { width: 4px; }
        #out::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        #out::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 2px; }

        .line {
            line-height: 1.6;
            margin-bottom: 8px;
            word-break: break-all;
            white-space: pre-wrap;
        }

        @keyframes blurIn {
            from { filter: blur(6px); opacity: 0; text-shadow: 0 0 10px currentColor; }
            to { filter: blur(0px); opacity: 1; text-shadow: none; }
        }
        .char-anim {
            display: inline-block;
            animation: blurIn 0.4s ease forwards;
        }
        
        .txt-bordo { color: #cc1144 !important; font-weight: bold; text-shadow: 0 0 4px rgba(204, 17, 68, 0.4); }
        .txt-yellow { color: var(--color-yellow) !important; font-weight: bold; text-shadow: 0 0 4px rgba(255, 204, 0, 0.4); }
        .txt-red { color: var(--color-red) !important; font-weight: bold; text-shadow: 0 0 5px rgba(255, 17, 17, 0.5); }
        .txt-dead { color: #777777 !important; font-weight: normal; }

        .input-line {
            display: flex;
            align-items: center;
            margin-top: auto; 
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, border-top-color 0.5s ease;
            flex-shrink: 0;
        }
        .input-line.active { opacity: 1; visibility: visible; }
        .prompt {
            margin-right: 12px;
            color: var(--glow);
            font-weight: bold;
            flex-shrink: 0;
            letter-spacing: 1px;
        }
        .input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        input {
            position: absolute;
            inset: 0;
            opacity: 0;
            background: transparent;
            border: none;
            outline: none;
            cursor: text;
            width: 100%;
        }
        .custom-view {
            color: #ffffff;        
            font-family: inherit;
            font-size: inherit;
            white-space: pre-wrap;
            display: inline-flex;
            align-items: center;
        }
        .custom-view::after {
            content: '_';
            margin-left: 3px;
            color: var(--glow);
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .error { color: var(--err); font-weight: bold; }
        .success { color: var(--acc); font-weight: bold; }
        .gray { color: #ffffff; opacity: 0.5; }
    </style>
</head>
<body>

<div id="intro-screen">
    <img src="atlantis.png" id="intro-logo" alt="ATLANTIS LOGO">
    <div id="intro-text"></div>
</div>

<div class="terminal-box" id="term">
    <div class="header" id="hd">
        <div class="logo-container" id="logos-box">
            <img src="atlantis.png" class="hub-logo logo-atlantis" alt="LOGOTYPE">
        </div>
        <span id="title-text">P.M.C. "ATLANTIS" // INFILTRATION & STEALTH OPERATIONS NETWORK</span>
    </div>
    <div id="out"></div>
    <div class="input-line" id="blk">
        <span class="prompt" id="pr">></span>
        <div class="input-wrapper">
            <input type="text" id="inp" autocomplete="off" disabled>
            <div class="custom-view" id="view"></div>
        </div>
    </div>
</div>
<script>
const CFG = { 
    SPD_INTRO: 30,
    SPD_TERMINAL: 15,
    SPD_BIO: 5,
    SPD_DIALOGUE: 25,
    SPD_DEAD: 40
};

const DOM = { 
    term: document.getElementById('term'), inp: document.getElementById('inp'), 
    view: document.getElementById('view'), out: document.getElementById('out'), 
    pr: document.getElementById('pr'), blk: document.getElementById('blk'),
    introScreen: document.getElementById('intro-screen'),
    introLogo: document.getElementById('intro-logo'),
    introText: document.getElementById('intro-text'),
    hd: document.getElementById('hd'),
    logosBox: document.getElementById('logos-box'),
    titleText: document.getElementById('title-text')
};

let step = 'menu'; 
let currentChapterIdx = 0;
let isMask = false;
let isPrinting = false;
const delay = ms => new Promise(r => setTimeout(r, ms));
let audioCtx = null;

// Функции вывода подняты в топ скрипта
function playBeep(f, t, d) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
        osc.type = t; osc.frequency.value = f; 
        g.gain.setValueAtTime(0.015, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
        osc.connect(g); g.connect(audioCtx.destination); 
        osc.start(); osc.stop(audioCtx.currentTime + d);
    } catch(e) {}
}

function playSiren(duration) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(90, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + duration);
        g.gain.setValueAtTime(0.03, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
}

function addLine(txt, cls = "") {
    const d = document.createElement('div'); d.className = `line ${cls}`; d.textContent = txt; 
    DOM.out.appendChild(d); DOM.out.scrollTop = DOM.out.scrollHeight; return d;
}

async function typeTerminal(txt, cls = "", speed = CFG.SPD_TERMINAL, withBeep = true) {
    isPrinting = true;
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        d.textContent += txt.charAt(i); 
        if (withBeep && Math.random() > 0.3) playBeep(840, 'square', 0.015); 
        await delay(speed);
    }
    DOM.out.scrollTop = DOM.out.scrollHeight;
    isPrinting = false;
}

async function typeAnimateDialogue(txt, cls = "") {
    isPrinting = true;
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        const span = document.createElement('span');
        span.className = 'char-anim';
        span.textContent = txt.charAt(i);
        d.appendChild(span);
        if (Math.random() > 0.3) playBeep(720, 'triangle', 0.02); 
        await delay(CFG.SPD_DIALOGUE);
    }
    DOM.out.scrollTop = DOM.out.scrollHeight;
    isPrinting = false;
}

const BIO_CHAPTERS = [
    `ГЛАВА 1: Рождение в трущобах.
Детство Сергея проходило среди серых промзон и фабричного дыма. С ранней юности ему пришлось уяснить простое правило: если не ударишь ты, ударят тебя. Жизнь не оставляла выбора.`,

    `ГЛАВА 2: Первая кровь и суровые уроки.
Уличные потасовки быстро переросли в нечто большее. Сломанный нос, первые шрамы и осознание того, что единственный способ выжить — стать умнее и жестче окружающих.`,

    `ГЛАВА 3: Военный контракт.
Армия стала для него спасением от тюрьмы, но бросила в самое пекло локальных конфликтов. Именно там сформировался его тяжелый взгляд, который теперь боятся подчиненные.`,

    `ГЛАВА 4: Роковая ошибка и шрамы.
Не все операции проходят гладко. Засада в ущелье унесла жизни его товарищей и оставила Сергею напоминание на всю жизнь — физическое и ментальное.`,

    `ГЛАВА 5: Знакомство с трубкой.
Горький табак стал единственным средством заглушить постоянный запах гари в воспоминаниях. Дым скрывал эмоции, которые профессионалу показывать нельзя.`,

    `ГЛАВА 6: Переход под крыло Atlantis.
ЧВК заметила перспективного оперативника с железной дисциплиной. Ему предложили работу, где не задают лишних вопросов, а просто ликвидируют угрозы.`,

    `ГЛАВА 7: Из грязи в командиры.
Годы безупречной службы, сотни выполненных контрактов. Сергей поднимался по карьерной лестнице, оставляя за спиной горы выжженной земли.`,

    `ГЛАВА 8: За кулисами штаба.
Управление целым отделом ГСБ требует больше хладнокровия, чем стрельба. Враги теперь плели интриги в кабинетах, а не прятались в окопах.`,

    `ГЛАВА 9: Уважение, выжженное сталью.
Отдел уважает его не за мягкость, а за то, что он никогда не прячется за чужие спины. Командир, готовый лично пойти в авангарде.`,

    `ГЛАВА 10: Настоящее время.
Сегодня он сидит в этом кресле, выпуская кольца дыма. Он прошел через ад, сломал систему, которая ломала его, и построил собственный бастион. Конец досье.`
];
async function typeIntro(txt, startLogo = false) {
    if (startLogo) DOM.introLogo.style.opacity = "1";
    for (let i = 0; i < txt.length; i++) {
        DOM.introText.textContent += txt.charAt(i);
        if (Math.random() > 0.3) playBeep(700, 'sine', 0.02);
        await delay(CFG.SPD_INTRO);
    }
}

function ask(promptText, maskInput = false) { 
    isMask = maskInput; 
    DOM.pr.textContent = promptText; 
    DOM.inp.value = DOM.view.textContent = ""; 
    DOM.inp.disabled = false; 
    DOM.blk.classList.add('active'); 
    DOM.inp.focus(); 
}

async function runCinematicIntro() {
    DOM.introText.textContent = "";
    await typeIntro("Сергей — хороший человек и отличный ГСБ, которого искренне уважает его отдел. ");
    await delay(1200);
    await typeIntro("Но задумывались ли вы когда-нибудь, через какой ад ему пришлось пройти и что именно он пережил, чтобы в итоге занять это кресло?\n\n");
    await delay(1500);
    await typeIntro("За жестким характером, вечной трубкой в зубах и тяжелым взглядом скрывается история парня, которого жизнь ломала с самого детства.", true);
    await delay(3500);

    DOM.introScreen.style.opacity = "0";
    await delay(1000);
    DOM.introScreen.style.display = "none";

    DOM.term.style.display = "flex";
    await delay(50);
    DOM.term.style.opacity = "1";
    
    await showMainMenu();
}

async function showMainMenu() {
    step = 'menu';
    DOM.term.className = "terminal-box";
    DOM.hd.className = "header";
    DOM.titleText.textContent = 'P.M.C. "ATLANTIS" // INFILTRATION & STEALTH OPERATIONS NETWORK';
    DOM.hd.style.borderBottomColor = "rgba(255, 255, 255, 0.2)";
    DOM.blk.style.borderTopColor = "rgba(255, 255, 255, 0.2)";
    DOM.logosBox.innerHTML = '<img src="atlantis.png" class="hub-logo logo-atlantis" alt="LOGOTYPE">';
    
    DOM.out.innerHTML = "";
    await typeTerminal("PMC ATLANTIS // CENTRAL CORE TERMINAL v4.0", "success");
    await typeTerminal("ДОСТУПНЫЕ ОПЦИИ СИСТЕМЫ:", "gray");
    await typeTerminal("1. Прочитать биографию Сергея", "success");
    ask('ВЫБЕРИТЕ ПУНКТ (1):', false);
}

async function printNextChapter() {
    if (currentChapterIdx < BIO_CHAPTERS.length) {
        step = 'reading_bio';
        addLine("\n---------------------------------------------------", "gray");
        await typeTerminal(BIO_CHAPTERS[currentChapterIdx], "", CFG.SPD_BIO);
        currentChapterIdx++;
        
        if (currentChapterIdx < BIO_CHAPTERS.length) {
            ask('ХАБ // НАЖМИТЕ [ENTER] ДЛЯ СЛЕДУЮЩЕЙ ГЛАВЫ...', false);
        } else {
            step = 'bio_finished';
            addLine("\n---------------------------------------------------", "gray");
            await typeTerminal("ДОСЬЕ ПОЛНОСТЬЮ СКОПИРОВАНО В БУФЕР ПАМЯТИ.", "success");
            ask('ХАБ // НАЖМИТЕ [ENTER] ДЛЯ ИНИЦИАЛИЗАЦИИ ВНЕШНЕГО КАНАЛА...', false);
        }
    }
}

async function runDialogueStage1() {
    step = 'dialogue_1';
    DOM.term.classList.add('stage-bordo');
    DOM.hd.style.borderBottomColor = "var(--color-bordo)";
    DOM.blk.style.borderTopColor = "var(--color-bordo)";
    DOM.logosBox.innerHTML = '<img src="logoLAS.png" class="hub-logo logo-las" alt="LAS">';
    
    playBeep(180, 'sawtooth', 0.4);
    await typeAnimateDialogue("[ВНЕШНИЙ КАНАЛ СВЯЗИ // ДЕПАРТАМЕНТ L.a.S]:", "txt-bordo");
    await typeAnimateDialogue("...А ты знаешь, кто на самом деле виновник той трагедии на Итагурской АЭС?", "txt-bordo");
    ask('ДЕПАРТАМЕНТ L.a.S // НАЖМИТЕ [ENTER]...', false);
}

async function runDialogueStage2() {
    step = 'dialogue_2';
    DOM.term.className = "terminal-box stage-split-2";
    DOM.logosBox.innerHTML = '<img src="logoLAS.png" class="hub-logo logo-las" alt="LAS">' +
                             '<img src="logoART.png" class="hub-logo logo-art" alt="ART">';
    
    playBeep(210, 'sawtooth', 0.4);
    await typeAnimateDialogue("\n[ВНЕШНИЙ КАНАЛ СВЯЗИ // ДЕПАРТАМЕНТ ART]:", "txt-yellow");
    await typeAnimateDialogue("...А ты знаешь, что Гилберта можно было спасти, а не убивать?", "txt-yellow");
    ask('ДЕПАРТАМЕНТ ART // НАЖМИТЕ [ENTER]...', false);
}

async function runDialogueStage3() {
    step = 'dialogue_3';
    DOM.term.className = "terminal-box stage-split-3";
    DOM.logosBox.innerHTML = '<img src="logoLAS.png" class="hub-logo logo-las" alt="LAS">' +
                             '<img src="logoART.png" class="hub-logo logo-art" alt="ART">' +
                             '<img src="logoTFB.png" class="hub-logo logo-tfb" alt="TFB">';
    
    playBeep(240, 'sawtooth', 0.6);
    await typeAnimateDialogue("\n[ВНЕШНИЙ КАНАЛ СВЯЗИ // ДЕПАРТАМЕНТ T.F.B]:", "txt-red");
    await typeAnimateDialogue("...А ты знаешь, что он убивал бойцов Расонии во втором секторе, когда те были согласны на перемирие?", "txt-red");
    
    addLine("\n---------------------------------------------------", "gray");
    ask('СВЯЗЬ ОБОРВАНА // НАЖМИТЕ [ENTER] ДЛЯ ОБРЫВА КАНАЛА...', false);
}

async function runTerminalFadeOut() {
    step = 'terminal_destroyed';
    DOM.term.style.opacity = "0";
    await delay(3000); 

    DOM.logosBox.innerHTML = ''; 
    DOM.hd.classList.add('shock-text');
    DOM.titleText.textContent = "Что за херня..?";
    DOM.out.innerHTML = "";
    
    DOM.blk.classList.remove('active'); 
    DOM.inp.disabled = true;

    DOM.term.className = "terminal-box dead-console";
    DOM.term.style.opacity = "0.35";
    await delay(500);

    await typeTerminal("--- АВАРИЙНЫЙ ДАМП ПАМЯТИ ЯДРА СЕКТОРНОЙ СЕТИ ATLANTIS ---", "txt-dead", CFG.SPD_DEAD, false);
    await delay(600);
    await typeTerminal("[КРИТИЧЕСКИЙ СБОЙ]: Потеря связи с внешним шлюзом управления.", "txt-dead", CFG.SPD_DEAD, false);
    await typeTerminal("[КРИТИЧЕСКИЙ СБОЙ]: Жизнеобеспечение кабинета ГСБ ... ОТКЛЮЧЕНО.", "txt-dead", CFG.SPD_DEAD, false);
    await delay(800);
    
    await typeTerminal("\n[ДАННЫЕ БИОМЕТРИИ ОПЕРАТИВНИКОВ ОТДЕЛЕНИЯ]:", "txt-dead", CFG.SPD_DEAD, false);
    await typeTerminal("[-] Офицер Сергей Долорофф (ID-001) ... СТАТУС: АСИСТОЛИЯ (00 BPM)", "txt-dead", CFG.SPD_DEAD, false);
    await typeTerminal("[-] Оперативник Кейн (ID-711) ......... СТАТУС: ЛЕТАЛЬНЫЙ (00 BPM)", "txt-dead", CFG.SPD_DEAD, false);
    await typeTerminal("[-] Оперативник Рейд (ID-402) ......... СТАТУС: ЛЕТАЛЬНЫЙ (00 BPM)", "txt-dead", CFG.SPD_DEAD, false);
    await delay(1000);

    await typeTerminal("\n[ВНИМАНИЕ]: Все жизненные показатели сектора равны нулю.", "txt-dead", CFG.SPD_DEAD, false);
    await typeTerminal("[СИСТЕМА]: Принудительная изоляция узла. База данных заброшена.", "txt-dead", CFG.SPD_DEAD, false);
}

DOM.inp.oninput = () => { 
    if(step === 'menu') {
        DOM.view.textContent = isMask ? "*".repeat(DOM.inp.value.length) : DOM.inp.value; 
    } else {
        DOM.view.textContent = "";
    }
};

DOM.inp.onkeydown = async (e) => {
    if (e.key !== 'Enter' || isPrinting) return;
    const v = DOM.inp.value, cv = v.trim();

    if (step === 'menu') {
        if (!v) return;
        DOM.blk.classList.remove('active'); 
        DOM.inp.disabled = true; 
        addLine(DOM.pr.textContent + " " + cv, 'success'); 
        await delay(300);

        if (cv === '1') {
            currentChapterIdx = 0;
            DOM.out.innerHTML = "";
            await printNextChapter();
        } else {
            DOM.term.classList.add('shake');
            playBeep(130, 'triangle', 0.35);
            setTimeout(() => DOM.term.classList.remove('shake'), 400);
            addLine("ОШИБКА: НЕВЕРНЫЙ ВЫБОР", "error");
            await delay(1000);
            await showMainMenu();
        }
    } 
    else if (step === 'reading_bio') {
        DOM.blk.classList.remove('active'); 
        DOM.inp.disabled = true;
        await printNextChapter();
    }
    else if (step === 'bio_finished') {
        DOM.blk.classList.remove('active'); 
        DOM.inp.disabled = true;
        await runDialogueStage1(); 
    }
    else if (step === 'dialogue_1') {
        DOM.blk.classList.remove('active'); 
        DOM.inp.disabled = true;
        await runDialogueStage2();
    }
    else if (step === 'dialogue_2') {
        DOM.blk.classList.remove('active'); 
        DOM.inp.disabled = true;
        await runDialogueStage3();
    }
    else if (step === 'dialogue_3') {
        DOM.blk.classList.remove('active'); 
        DOM.inp.disabled = true;
        await runTerminalFadeOut();
    }
};

document.onclick = () => DOM.inp.disabled || DOM.inp.focus(); 
window.onload = runCinematicIntro;
</script>
</body>
</html>
